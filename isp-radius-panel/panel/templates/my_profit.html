{% extends "base.html" %}
{% from "_macros.html" import icon %}
{% block title %}My Profit{% endblock %}
{% block content %}
<div class="page-head">
  <div><h1>My Profit</h1><p class="sub">{{ start|d }} to {{ end|d }}</p></div>
  <form class="actions" method="get">
    <input type="date" name="from" value="{{ start.isoformat() }}" aria-label="From" style="width:auto">
    <input type="date" name="to" value="{{ end.isoformat() }}" aria-label="To" style="width:auto">
    {% include '_profit_pick.html' %}
    <button class="btn primary" type="submit">Show</button>
    <a class="btn" href="{{ url_for('my_profit_csv', **{'from': start.isoformat(), 'to': end.isoformat(), 'seller': chosen.id if chosen else '', 'below': 1 if below else ''}) }}">{{ icon('download') }}CSV</a>
  </form>
</div>
{% include '_profit.html' %}
{% endblock %}
