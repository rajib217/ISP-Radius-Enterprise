<div class="tabs">
  <a class="{{ 'on' if endpoint == 'logs' and request.args.get('tab') != 'activity' }}" href="{{ url_for('logs') }}">Login attempts</a>
  <a class="{{ 'on' if endpoint == 'logs' and request.args.get('tab') == 'activity' }}" href="{{ url_for('logs', tab='activity') }}">Panel activity</a>
  <a class="{{ 'on' if endpoint == 'logs_sessions' }}" href="{{ url_for('logs_sessions') }}">Sessions</a>
  {% if can(('sms', 'email')) %}<a href="{{ url_for('messages') }}">Messages</a>{% endif %}
</div>
