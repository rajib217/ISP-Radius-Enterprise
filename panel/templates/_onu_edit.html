{% if can('network', 'edit') %}
<dialog class="modal" id="onu-dlg" aria-labelledby="onu-title">
  <form method="post" action="{{ url_for('onu_save') }}">
    {{ csrf_input() }}<input type="hidden" name="id">
    <div class="modal-head"><h2 id="onu-title">Edit ONU note</h2><button type="button" class="btn sm icon" data-close aria-label="Close" title="Close">{{ icon('x') }}</button></div>
    <div class="modal-body">
      <p class="sub">Name, serial, MAC, port, signal and status come from the OLT's SNMP sync. Link a customer with Map to Subscriber.</p>
      <div class="field"><label class="lbl" for="o-note">Note</label><input id="o-note" name="note" maxlength="255"></div>
    </div>
    <div class="modal-foot"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary" type="submit">Save</button></div>
  </form>
</dialog>
{% endif %}
