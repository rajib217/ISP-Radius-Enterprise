{% extends "portal_base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<section class="panel" style="max-width:380px;margin:8vh auto 0;width:100%">
  <form method="post" autocomplete="on" class="stack" style="display:grid;gap:14px">
    {{ csrf_input() }}
    <div><h1 style="margin:0;font-size:22px">{{ isp or 'My connection' }}</h1><p class="muted" style="margin:4px 0 0">Sign in with your internet username and password.</p></div>
    {% if error %}<div class="pt-flash error" role="alert">{{ error }}</div>{% endif %}
    <div class="field"><label class="lbl" for="u">Username</label><input id="u" name="username" autocomplete="username" autofocus required></div>
    <div class="field"><label class="lbl" for="p">Password</label><input id="p" name="password" type="password" autocomplete="current-password" required></div>
    <button class="btn primary" type="submit" style="height:42px">Sign in</button>
  </form>
</section>
{% endblock %}
